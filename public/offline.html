<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <title>Sin conexion | COSAIF Logistics</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 20% 15%, rgba(14, 165, 233, 0.12), transparent 28%),
          linear-gradient(135deg, #f8fafc 0%, #eef6f2 100%);
      }

      main {
        width: min(440px, 100%);
        border: 1px solid rgba(148, 163, 184, 0.28);
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 24px 70px rgba(15, 23, 42, 0.14);
        padding: 28px;
      }

      img {
        width: 64px;
        height: 64px;
        border-radius: 16px;
        display: block;
        margin-bottom: 18px;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 24px;
        line-height: 1.15;
      }

      p {
        margin: 0 0 18px;
        color: #475569;
        line-height: 1.55;
      }

      button {
        appearance: none;
        border: 0;
        border-radius: 10px;
        background: #0284c7;
        color: #fff;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
        min-height: 44px;
        padding: 0 18px;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          background: #0b1220;
          color: #f8fafc;
        }

        body {
          background:
            radial-gradient(circle at 20% 15%, rgba(14, 165, 233, 0.16), transparent 28%),
            linear-gradient(135deg, #0b1220 0%, #111827 100%);
        }

        main {
          border-color: rgba(148, 163, 184, 0.22);
          background: rgba(15, 23, 42, 0.9);
        }

        p {
          color: #cbd5e1;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/cosaif-192.png" alt="COSAIF Logistics" />
      <h1>Sin conexion</h1>
      <p>
        La app esta instalada, pero necesita internet para cargar informacion nueva,
        movimientos, incidentes y sesiones.
      </p>
      <button type="button" onclick="window.location.reload()">Reintentar</button>
    </main>
  </body>
</html>
